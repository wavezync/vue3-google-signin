name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing: npm trades GitHub's OIDC token for a short-lived
  # publish token and adds provenance, so no npm token is stored here
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org/
          # No dependency cache in release builds, as npm recommends
          cache: ""
      - run: pnpm lint
      - run: pnpm build
      # Ship only what passes the same tests as CI
      - run: pnpm --filter e2e test
      # Trusted publishing needs npm 11.5.1+; Node 24 bundles 11.x
      - run: npm publish
