name: Setup
description: Install pnpm and Node.js (from .node-version), then the workspace's dependencies

inputs:
  registry-url:
    description: npm registry to authenticate against, for publishing
    required: false
    default: ""
  cache:
    description: Package manager whose store to cache, or "" for none (release builds)
    required: false
    default: pnpm

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
